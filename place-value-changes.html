<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greater &amp; Less Place Value Practice</title>
    <meta name="description" content="Practice finding numbers that are greater or less by a given place-value amount.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-content">
        <div class="problem-area">
            <div class="header-container">
                <a href="index.html" class="home-button">🏠 Home</a>
                <h1>Place Value Changes 🔢</h1>
                <button class="toggle-scratchpad" id="toggle-scratchpad">📝 Open Scratchpad</button>
            </div>

            <div class="container rounding-page">
                <div class="rounding-controls">
                    <label for="place-value-mode">Change by</label>
                    <select id="place-value-mode" class="rounding-select">
                        <option value="10">10</option>
                        <option value="100">100</option>
                        <option value="1000">1,000</option>
                        <option value="10000" selected>10,000</option>
                        <option value="100000">100,000</option>
                        <option value="mixed-large">10,000 &amp; 100,000</option>
                        <option value="mixed">All place values</option>
                    </select>
                </div>

                <section class="problem rounding-problem" aria-labelledby="place-value-question">
                    <p class="rounding-step" id="problem-count"></p>
                    <h2 class="problem-question" id="place-value-question"></h2>

                    <button
                        class="hint-button"
                        id="hint-button"
                        type="button"
                        aria-expanded="false"
                        aria-controls="place-value-visual"
                    >💡 Show hint</button>

                    <div class="rounding-visual" id="place-value-visual" aria-label="Place value hint" hidden>
                        <div class="place-value-wrap">
                            <p class="visual-heading" id="hint-heading"></p>
                            <div class="place-change-equation" id="place-change-equation"></div>
                            <div class="place-change-table" id="place-change-table"></div>
                            <p class="digit-rule" id="place-change-rule"></p>
                        </div>
                    </div>
                </section>

                <div class="options rounding-options" id="options-container" aria-label="Answer choices"></div>

                <div class="navigation">
                    <button class="nav-button" id="prev-btn">← Previous</button>
                    <button class="nav-button" id="next-btn">Next →</button>
                </div>
            </div>
        </div>

        <div class="scratchpad-area" id="scratchpad-area">
            <div class="scratchpad-controls">
                <button class="scratchpad-button" id="undo-btn">↩️ Undo</button>
                <button class="scratchpad-button" id="redo-btn">↪️ Redo</button>
                <button class="scratchpad-button clear" id="clear-btn">🗑️ Clear</button>
                <button class="scratchpad-button" id="close-scratchpad">❌ Close</button>
            </div>
            <canvas class="scratchpad-canvas" id="scratchpad"></canvas>
        </div>
    </div>

    <div class="problem-type">Greater &amp; Less Place Value</div>
    <div class="stars" id="stars-container"></div>
    <script src="place-value-changes.js" type="module" defer></script>
</body>
</html>
